[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projectmind-mcp"
version = "0.1.0"
description = "Local-first MCP server for verifiable project intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7",
  "networkx>=3.2",
  "GitPython>=3.1",
  "watchfiles>=0.21",
  "tree-sitter>=0.22",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
projectmind = "projectmind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/projectmind"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
disable_error_code = ["var-annotated", "operator", "return-value", "index", "arg-type", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
